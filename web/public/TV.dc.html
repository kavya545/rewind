<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&family=Rammetto+One&family=Lexend:wght@400;600;800&family=Instrument+Serif&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:'Lexend',sans-serif;background:#16110b}
a{color:inherit}a:hover{color:#dcb85a}
button:focus-visible{outline:2px solid #dcb85a;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

<script src="./liquid.js"></script>
<script src="./footer.js"></script>
</helmet>
<div aria-hidden="true" style="position:fixed;inset:0;z-index:90;pointer-events:none"><div style="{{ onTop }}"></div><div style="{{ onBot }}"></div><div style="{{ offLine }}"></div></div>
<div style="{{ pageStyle }}" onDragOver="{{ onDragOver }}" onDrop="{{ onDrop }}">
  <div style="{{ stageStyle }}">
    <img src="assets/tv-room-plate.webp" data-liquid="" alt="A sunlit room with a wooden dresser" draggable="false" style="{{ bgFullStyle }}">
    <div style="{{ tvStyle }}">
    <div style="{{ glowStyle }}"></div>
    <div onClick="{{ onScreenClick }}" style="{{ scrBox }}">
      <video ref="{{ videoRef }}" playsInline="{{ true }}" loop="{{ true }}" onTimeUpdate="{{ onTime }}" onPlay="{{ onPlay }}" onPause="{{ onPause }}" onEnded="{{ onEnded }}" style="position:absolute;width:2px;height:2px;opacity:0;pointer-events:none"></video>
      <canvas ref="{{ outRef }}" width="640" height="480" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 30% 20%,rgba(255,255,255,.07),transparent 60%);box-shadow:inset 0 0 60px rgba(0,0,0,.85);pointer-events:none"></div>

        <div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font-family:'VT323',monospace;color:#e9f4ea;text-shadow:2px 0 rgba(255,0,60,.55),-2px 0 rgba(0,200,255,.55);pointer-events:none;text-align:center">
          <span ref="{{ blinkRef }}" style="font-size:9cqw;line-height:1">INSERT TAPE</span>
          <span style="font-size:3.2cqw">USE THE SLOT · OR DROP A VIDEO · MAX {{ maxMB }} MB</span>
        </div>
      </sc-if>
      <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;right:0;top:42%;text-align:center;font-family:'VT323',monospace;font-size:5cqw;color:#2a2016;background:#dcb85a;padding:6px 0;pointer-events:none">{{ err }}</div>
      </sc-if>
    </div>
    <button onClick="{{ stepVolume }}" onWheel="{{ wheelVolume }}" onMouseEnter="{{ hint_vhf }}" onMouseLeave="{{ unhint }}" aria-label="Volume" style="{{ volBox }}" style-hover="box-shadow:0 0 0 1.5px rgba(220,184,90,.8),0 0 14px rgba(220,184,90,.5)"></button>
    <button onClick="{{ togglePower }}" onWheel="{{ wheelPreset }}" onMouseEnter="{{ hint_power }}" onMouseLeave="{{ unhint }}" aria-label="Power" style="{{ knobStyle }}" style-hover="box-shadow:0 0 0 1.5px #dcb85a,0 0 14px #dcb85a" style-active="transform:scale(.92)"></button>
    <button onClick="{{ stepIntensity }}" onWheel="{{ wheelIntensity }}" onMouseEnter="{{ hint_uhf }}" onMouseLeave="{{ unhint }}" aria-label="Effect intensity" style="{{ intBox }}" style-hover="box-shadow:0 0 0 1.5px rgba(220,184,90,.8),0 0 14px rgba(220,184,90,.5)"></button>

    <button onClick="{{ togglePower }}" onMouseEnter="{{ hint_power }}" onMouseLeave="{{ unhint }}" aria-label="Power" style="{{ powBox }}" style-hover="box-shadow:0 0 0 1.5px #dcb85a,0 0 12px #dcb85a" style-active="transform:scale(.9)"></button>
    <span style="{{ ledStyle }}"></span>
    </div>
  </div>
  <input ref="{{ fileRef }}" type="file" accept="video/*" onChange="{{ onFile }}" style="display:none">

  <nav style="position:absolute;top:20px;left:24px;display:flex;flex-direction:column;gap:6px;z-index:2">
    <a href="Home.dc.html" onClick="{{ goHome }}" aria-label="Back to the room" style="display:flex;align-items:center;gap:10px;font-family:'VT323',monospace;font-size:clamp(22px,2vw,30px);letter-spacing:.06em;color:#f6efe4;text-decoration:none;text-shadow:0 0 8px rgba(0,0,0,.5);padding:2px 6px;margin:-2px -6px;border-radius:6px;width:max-content" style-hover="background:rgba(255,255,255,.1)"><svg width="18" height="20" viewBox="0 0 18 20"><path d="M16 1L1 10l15 9z" fill="#f6efe4"></path></svg>BACK</a>
    <span style="font-family:'VT323',monospace;font-size:22px;letter-spacing:.04em;color:#dcb85a;text-shadow:0 1px 8px rgba(0,0,0,.7)">{{ hint }}</span>

    <span style="writing-mode:vertical-rl;transform:rotate(180deg);font-family:'VT323',monospace;font-size:20px;letter-spacing:.14em;color:#f1e6cf;white-space:nowrap">OPEN TV LAB</span>
  </button>

    <div style="display:flex;align-items:center;gap:12px;padding:16px 18px 12px">
      <span style="flex:1;font-family:'VT323',monospace;font-size:28px;letter-spacing:.02em;line-height:1;color:#f1e6cf">control panel</span>
      <span style="font-family:'VT323',monospace;font-size:12px;letter-spacing:.08em;color:rgba(241,230,207,.6);font-size:13px">NO. 094</span>
      <button onClick="{{ toggleDrawer }}" aria-label="Collapse panel" style="width:30px;height:30px;flex-shrink:0;border-radius:6px;border:1px solid rgba(241,230,207,.6);background:transparent;color:#f1e6cf;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:rgba(241,230,207,.1)" style-active="transform:scale(.94)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </div>
    <div style="margin:0 18px;border-top:1px solid rgba(241,230,207,.14);padding:12px 0;display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span style="font-family:'VT323',monospace;font-size:16px;letter-spacing:.08em;color:#f1e6cf">PICTURE TUBE</span><span style="font-family:'VT323',monospace;font-size:12px;letter-spacing:.08em;color:rgba(241,230,207,.6)">CHOOSE THE LOOK</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <sc-for list="{{ presets }}" as="m" hint-placeholder-count="3">
          <button onClick="{{ m.pick }}" style="{{ m.style }}"><span style="{{ m.led }}"></span>{{ m.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="margin:0 18px;border-top:1px solid rgba(241,230,207,.14);padding:12px 0;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:14px">

      <div style="display:flex;align-items:center;gap:14px">
        <span style="font-family:'VT323',monospace;font-size:16px;letter-spacing:.08em;color:#f1e6cf;width:72px;flex-shrink:0">INTENSITY</span>

          <div style="{{ intThumb }}"></div>

        <span style="width:34px;height:22px;flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:1px solid rgba(241,230,207,.3);border-radius:4px;font-family:'VT323',monospace;font-size:16px;color:#f1e6cf">{{ intensity }}</span>
      </div>
    </div>
    <div style="margin:0 18px;border-top:1px solid rgba(241,230,207,.14);padding:10px 0 12px;display:flex;flex-direction:column;gap:8px">

        </div>

    </div>
    <div style="margin:0 18px;border-top:1px solid rgba(241,230,207,.14);padding:12px 0 0">
      <button onClick="{{ mainAction }}" style="width:100%;height:40px;border-radius:6px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.06);color:#f1e6cf;display:flex;align-items:center;gap:16px;padding:0 18px 0 22px;cursor:pointer" style-hover="background:rgba(255,255,255,.14);border-color:#f3ede4" style-active="transform:translateY(1px)">

        <span style="flex:1;text-align:left;font-family:'VT323',monospace;font-size:19px;letter-spacing:.04em">{{ mainLabel }}</span>

      <span>RECORDS IN REAL TIME, WITH EFFECTS · WEBM / MP4</span>

      <button onClick="{{ toggleLights }}" style="border:0;padding:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px" style-hover="color:#f3ede4">{{ lightsLabel }}</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;maxUploadMB&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100,&quot;min&quot;:10,&quot;max&quot;:1000,&quot;step&quot;:10,&quot;unit&quot;:&quot;MB&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;defaultPreset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vhs&quot;,&quot;crt&quot;,&quot;bw&quot;],&quot;default&quot;:&quot;vhs&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

  bw:    { label: 'b&w', grade: 'grayscale(1) contrast(1.35) brightness(1.08) blur(.5px)', chroma: 0, grain: .15, fx: { chroma: 0, static: 1, scan: 1, tracking: 0, vignette: 1, flicker: 1, weave: 0, dust: 0, date: 0, osd: 1 } },
};
const FXDESC = { chroma: 'red & blue drift', static: 'snow on the line', scan: 'tube lines', tracking: 'rolling bar', flicker: 'unsteady light' };

const BTN = { fontFamily: "'Lexend',sans-serif", fontSize: 12, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' };

class Component extends DCLogic {
  constructor(p) {
    super(p);

  }
  videoRef = React.createRef(); outRef = React.createRef(); blinkRef = React.createRef(); fileRef = React.createRef(); rootRef = React.createRef();
  componentDidMount() {

    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ arrived: true })));
    this.srcC = document.createElement('canvas'); this.srcC.width = W; this.srcC.height = H;
    this.sctx = this.srcC.getContext('2d', { willReadFrequently: true });
    this.octx = this.outRef.current.getContext('2d');
    this.outImg = this.octx.createImageData(W, H);

    document.fonts && document.fonts.load('28px VT323');
    this.trackY = -40; this.frame = 0; this.wx = 0; this.wy = 0;

    this.raf = requestAnimationFrame(loop);

  initSfx() {

      let b0 = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = .6 * b0 + .4 * w; d[i] = w * .55 + b0 * .45; }

  }
  updateSfx() {

  powerSound(turnOn) {
    if (!this.ax) return; const ax = this.ax, t = ax.currentTime, v = Math.max(.25, this.state.volume / 100);
    const clk = ax.createBufferSource(); clk.buffer = this.noiseBuf; const cg = ax.createGain(), cf = ax.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 2400; cf.Q.value = .8;
    cg.gain.setValueAtTime(.5 * v, t); cg.gain.exponentialRampToValueAtTime(.001, t + .05); clk.connect(cf); cf.connect(cg); cg.connect(this.master); clk.start(t, Math.random()); clk.stop(t + .07);
    const o = ax.createOscillator(), og = ax.createGain(); o.type = 'sine';
    if (turnOn) { o.frequency.setValueAtTime(48, t + .04); o.frequency.exponentialRampToValueAtTime(90, t + .5); og.gain.setValueAtTime(.0001, t + .04); og.gain.exponentialRampToValueAtTime(.28 * v, t + .1); og.gain.exponentialRampToValueAtTime(.001, t + .7); }
    else { o.frequency.setValueAtTime(900, t + .02); o.frequency.exponentialRampToValueAtTime(60, t + .35); og.gain.setValueAtTime(.12 * v, t + .02); og.gain.exponentialRampToValueAtTime(.001, t + .4); }
    o.connect(og); og.connect(this.master); o.start(t); o.stop(t + .8);

  componentWillUnmount() { window.removeEventListener('pointerdown', this.onFirst); window.removeEventListener('keydown', this.onFirst); this.ax && this.ax.close(); cancelAnimationFrame(this.raf); window.removeEventListener('resize', this.onResize); clearTimeout(this.errT); if (this.state.src) URL.revokeObjectURL(this.state.src); }

        style: { height: 32, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, borderRadius: 4, cursor: 'pointer', fontFamily: "'VT323',monospace", fontSize: 16, letterSpacing: '.08em', border: '1px solid ' + (on ? gold : 'rgba(241,230,207,.45)'), background: on ? gold : 'transparent', color: on ? '#2a2016' : ivory, fontWeight: on ? 600 : 400, transition: 'all .15s' } }; }),
      onTime: e => this.setState({ t: e.target.currentTime, dur: e.target.duration || 0 }),
      onPlay: () => this.setState({ playing: true }), onPause: () => this.setState({ playing: false }),
      onEnded: () => { if (this.state.exporting) this.stopExport(); },
      pickFile: () => { if (!on) return; this.fileRef.current.click(); },
      onFile: e => { this.load(e.target.files[0]); e.target.value = ''; },
      onScreenClick: () => { if (!on) return; if (!src) return this.fileRef.current.click(); const v = this.videoRef.current; v.paused ? v.play() : v.pause(); },
      onDragOver: e => e.preventDefault(),
      onDrop: e => { e.preventDefault(); if (on) this.load(e.dataTransfer.files[0]); },
      togglePlay: () => { if (!on || !src) return; const v = this.videoRef.current; this.actx && this.actx.resume(); v.paused ? v.play() : v.pause(); },
      stepVolume: () => setV(volume >= 100 ? 0 : volume + 10),
      wheelVolume: e => setV(volume + (e.deltaY > 0 ? -5 : 5)),
      noTape: !src,
      dlLabel: exporting ? `recording ${dur ? Math.round(t / dur * 100) : 0}% · stop` : (src ? 'generate & download' : 'insert a tape first'),
      onExport: () => { if (!on || !src) return this.flash(on ? 'INSERT A TAPE FIRST' : ''); exporting ? this.stopExport() : this.startExport(); },
      togglePower: () => {
        const n = !on; this.powerT = performance.now(); this.initSfx(); this.powerSound(n);
        const v = this.videoRef.current;
        if (!n) { if (exporting) this.stopExport(); this.wasPlaying = v && !v.paused; v && v.pause(); }
        else if (this.wasPlaying && src) v.play().catch(() => {});
        this.setState({ on: n });
      },
      toggleLights: () => this.setState({ dark: !dark })
    };
  }
}
</script>
