<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&family=Rammetto+One&family=Lexend:wght@400;600;800&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f1e6cf;color:#c4472b;font-family:'Lexend',sans-serif}
a{color:#c4472b}a:hover{color:#9e3420}
button{font-family:inherit}
button:focus-visible{outline:2px solid #f2b544;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</helmet>
<div onDragOver="{{ onDragOver }}" onDrop="{{ onDrop }}" style="height:100vh;display:flex;flex-direction:column;box-sizing:border-box;background-image:radial-gradient(rgba(120,70,30,.07) 1px,transparent 1px);background-size:4px 4px">
  <nav style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px clamp(16px,3vw,40px)">
    <a href="Home.dc.html" style="font-family:'Rammetto One',serif;font-size:20px;text-decoration:none">← Rewind</a>
    <span style="font-family:'Rammetto One',serif;font-size:18px;text-shadow:2px 2px 0 #f2b544">photo booth</span>
    <button onClick="{{ pickFiles }}" style="font-size:12px;font-weight:600;border:1.5px solid #c4472b;box-shadow:2px 2px 0 #c4472b;background:#f2b544;color:#22392a;padding:7px 14px;cursor:pointer" style-active="transform:translate(2px,2px);box-shadow:none">+ add photos</button>
    <input ref="{{ fileRef }}" type="file" multiple accept="image/*" onChange="{{ onFiles }}" style="display:none">
  </nav>

  <sc-if value="{{ always }}" hint-placeholder-val="{{ true }}">
    <div style="{{ workStyle }}">
      <div style="{{ previewWrapStyle }}">
        <div style="position:absolute;inset:0 0 26px 0;display:flex;align-items:center;justify-content:center">
          <canvas ref="{{ previewRef }}" style="{{ canvasStyle }}"></canvas>
          <sc-if value="{{ noSel }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ emptyClick }}" style="display:flex;flex-direction:column;align-items:center;gap:10px;max-width:360px;padding:28px 32px;border:1.5px dashed #c4472b;background:transparent;color:#c4472b;cursor:pointer;text-align:center" style-hover="background:rgba(242,181,68,.18)">
              <span style="font-family:'Rammetto One',serif;font-size:24px;line-height:1.1;text-shadow:3px 3px 0 #f2b544">{{ emptyTitle }}</span>
              <span style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.5">{{ emptySub }}</span>
            </button>
          </sc-if>
        </div>
        <span style="position:absolute;left:0;right:0;bottom:0;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:center">{{ previewInfo }}</span>
      </div>
      <aside style="min-height:0;overflow-y:auto;background:#22392a;color:#f1e6cf;border:1.5px solid #f2b544;border-radius:14px;box-shadow:6px 6px 0 #c4472b;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(242,181,68,.25)">
          <span style="font-family:'Rammetto One',serif;font-size:20px;line-height:1">darkroom</span>
          <span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#d9c9a3">{{ selInfo }}</span>
        </div>
        <div style="padding:12px 18px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(242,181,68,.25)">
          <sc-for list="{{ layouts }}" as="l" hint-placeholder-count="3">
            <button onClick="{{ l.pick }}" style="{{ l.style }}"><span style="font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">{{ l.label }}</span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8">{{ l.desc }}</span></button>
          </sc-for>
          <div style="display:flex;gap:8px">
            <button onClick="{{ selectAll }}" style="flex:1;font-size:11px;font-weight:600;border:1.5px solid #f2b544;background:transparent;color:#f1e6cf;padding:6px 0;cursor:pointer" style-hover="background:#f2b544;color:#22392a">pick all</button>
            <button onClick="{{ clearSel }}" style="flex:1;font-size:11px;font-weight:600;border:1.5px solid #f2b544;background:transparent;color:#f1e6cf;padding:6px 0;cursor:pointer" style-hover="background:#f2b544;color:#22392a">clear</button>
          </div>
        </div>
        <div style="padding:12px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid rgba(242,181,68,.25)">
          <sc-for list="{{ sliders }}" as="s" hint-placeholder-count="4">
            <div style="display:flex;align-items:center;gap:12px">
              <span style="font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;width:86px">{{ s.label }}</span>
              <div onPointerDown="{{ s.down }}" style="position:relative;flex:1;height:30px;cursor:pointer;touch-action:none">
                <div style="position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:rgba(241,230,207,.18)"></div>
                <div style="{{ s.fill }}"></div>
                <div style="{{ s.thumb }}"></div>
              </div>
              <span style="min-width:40px;height:26px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:1.5px solid #f2b544;border-radius:4px;font-family:'VT323',monospace;font-size:20px">{{ s.value }}</span>
            </div>
          </sc-for>
        </div>
        <div style="padding:6px 18px 8px;display:flex;flex-direction:column;border-bottom:1px solid rgba(242,181,68,.25)">
          <sc-for list="{{ switches }}" as="w" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0">
              <div style="display:flex;flex-direction:column;gap:2px"><span style="font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">{{ w.label }}</span><span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#d9c9a3">{{ w.desc }}</span></div>
              <button onClick="{{ w.toggle }}" aria-label="{{ w.label }}" style="position:relative;width:56px;height:24px;flex-shrink:0;border-radius:4px;border:1.5px solid #f2b544;background:transparent;cursor:pointer;padding:0"><span style="{{ w.block }}"></span></button>
            </div>
          </sc-for>
        </div>
        <div style="padding:14px 18px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;border:1.5px solid #f2b544">
            <sc-for list="{{ formats }}" as="x" hint-placeholder-count="2">
              <button onClick="{{ x.pick }}" style="{{ x.style }}">{{ x.label }}</button>
            </sc-for>
          </div>
          <button onClick="{{ doExport }}" disabled="{{ cantExport }}" style="height:46px;width:100%;border-radius:4px;border:1.5px solid #f2b544;background:#f2b544;color:#22392a;box-shadow:3px 3px 0 #c4472b;cursor:pointer;font-size:14px;font-weight:800;letter-spacing:.04em" style-hover="background:#f1e6cf;border-color:#f1e6cf" style-active="transform:translate(3px,3px);box-shadow:none">{{ exportLabel }}</button>
          <span style="{{ exportMsgStyle }}">{{ exportMsg }}</span>
        </div>
      </aside>
    </div>
    <div style="flex-shrink:0;position:relative;background:#17130f;padding:22px 0 20px">
      <div style="position:absolute;left:0;right:0;top:6px;height:8px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(241,230,207,.75) 10px 22px);pointer-events:none"></div>
      <div style="position:absolute;left:0;right:0;bottom:6px;height:8px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(241,230,207,.75) 10px 22px);pointer-events:none"></div>
      <div style="display:flex;gap:12px;overflow-x:auto;padding:6px clamp(16px,3vw,40px);align-items:center">
        <sc-for list="{{ tray }}" as="p" hint-placeholder-count="4">
          <div style="position:relative;flex-shrink:0;display:flex;flex-direction:column;gap:4px">
            <button onClick="{{ p.click }}" title="{{ p.name }}" style="{{ p.frameStyle }}"><img src="{{ p.thumb }}" alt="{{ p.name }}" draggable="false" style="height:100%;width:auto;display:block"></button>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;height:14px">
              <span style="font-family:'Space Mono',monospace;font-size:9px;font-weight:700;color:#e8962f">{{ p.no }}</span>
              <span style="{{ p.badgeStyle }}">{{ p.badge }}</span>
            </div>
            <button onClick="{{ p.remove }}" aria-label="Remove photo" style="position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#c4472b;color:#f1e6cf;border:1.5px solid #f1e6cf;font-size:10px;line-height:1;cursor:pointer;padding:0">✕</button>
          </div>
        </sc-for>
        <button onClick="{{ pickFiles }}" style="flex-shrink:0;height:72px;width:72px;margin-bottom:18px;border:1.5px dashed #f2b544;background:transparent;color:#f2b544;font-size:11px;font-weight:600;cursor:pointer">+ add</button>
      </div>
    </div>
  </sc-if>

  <div style="position:fixed;top:64px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:20;max-width:min(360px,calc(100vw - 40px));pointer-events:none">
    <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="1">
      <div style="{{ t.style }}">{{ t.text }}</div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;maxUploadMB&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:80,&quot;min&quot;:10,&quot;max&quot;:500,&quot;step&quot;:10,&quot;unit&quot;:&quot;MB&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;defaultLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;strip&quot;,&quot;booth&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;strip&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MAX_PX = 16e6;
const FILM = {
  strip: { label: 'film strip', desc: 'vertical 35mm · up to 6 frames', max: 6 },
  booth: { label: 'booth grid', desc: 'classic print · up to 9 frames', max: 9 },
  contact: { label: 'contact sheet', desc: 'the whole roll · up to 36', max: 36 },
};
const SLIDERS = [['grain', 'grain'], ['warmth', 'warm tone'], ['fade', 'fade'], ['leak', 'light leak']];
const pad = n => String(n).padStart(2, '0');
const stampText = ts => { const d = new Date(ts); return "'" + String(d.getFullYear()).slice(2) + ' ' + pad(d.getMonth() + 1) + ' ' + pad(d.getDate()); };
const longDate = d => MONTHS[d.getMonth()] + ' ' + d.getDate() + ' ' + d.getFullYear();

function scaleCanvas(img, edge) {
  const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, edge / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const x = c.getContext('2d'); x.fillStyle = '#f1e6cf'; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height); return c;
}
const toBlob = (c, type, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), type, q));
const loadImg = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = url; });
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fill(); }
function drawFit(c, img, r, contain) {
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height, sa = sw / sh, ra = r.w / r.h;
  if (contain) { let w = r.w, h = r.h; if (sa > ra) h = r.w / sa; else w = r.h * sa; c.drawImage(img, r.x + (r.w - w) / 2, r.y + (r.h - h) / 2, w, h); return; }
  let cw = sw, ch = sh, cx = 0, cy = 0;
  if (sa > ra) { cw = sh * ra; cx = (sw - cw) / 2; } else { ch = sw / ra; cy = (sh - ch) / 2; }
  c.drawImage(img, cx, cy, cw, ch, r.x, r.y, r.w, r.h);
}
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }

class Component extends DCLogic {
  state = { photos: [], sel: [], layout: 'strip', grain: 35, warmth: 45, fade: 30, leak: 25, mono: false, date: true, fmt: 'png', toasts: [], exporting: false, exportMsg: '', exportOk: true, vw: window.innerWidth };
  fileRef = React.createRef(); previewRef = React.createRef(); imgs = new Map();
  componentDidMount() {
    if (this.props.defaultLayout && FILM[this.props.defaultLayout]) this.setState({ layout: this.props.defaultLayout });
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    this.fontsReady = document.fonts ? Promise.all(["76px 'Rammetto One'", "bold 26px 'Space Mono'", "40px 'VT323'"].map(f => document.fonts.load(f))).catch(() => {}) : Promise.resolve();
    this.fontsReady.then(() => this.schedulePreview());
    window.__afterplay = { add: fs => this.addFiles(fs), test: l => this.testRender(l) };
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearTimeout(this.pvT); }
  componentDidUpdate(pp, ps) {
    const s = this.state;
    if (ps.sel !== s.sel || ps.photos !== s.photos || ps.layout !== s.layout || ps.grain !== s.grain || ps.warmth !== s.warmth || ps.fade !== s.fade || ps.leak !== s.leak || ps.mono !== s.mono || ps.date !== s.date) this.schedulePreview();
  }
  toast(text, kind) {
    const id = Math.random();
    this.setState(s => ({ toasts: s.toasts.concat([{ id, text, kind }]) }));
    setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), kind === 'err' ? 7000 : 3500);
  }
  async addFiles(list) {
    const files = Array.from(list || []); if (!files.length) return;
    const max = this.props.maxUploadMB ?? 80, bad = []; let ok = 0;
    for (const f of files) {
      if (!/^image\//.test(f.type) && !/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(f.name)) { bad.push(f.name + " isn't an image"); continue; }
      if (f.size > max * 1048576) { bad.push(f.name + ' is over ' + max + ' MB'); continue; }
      try { const p = await this.develop(f); ok++; this.setState(s => ({ photos: s.photos.concat([p]), sel: s.sel.length < 4 ? s.sel.concat([p.id]) : s.sel })); }
      catch (e) { bad.push(/\.(heic|heif)$/i.test(f.name) ? f.name + ": HEIC isn't supported — save it as JPEG" : f.name + " couldn't be read"); }
    }
    if (ok) this.toast(ok + ' photo' + (ok > 1 ? 's' : '') + ' added', 'ok');
    if (bad.length) this.toast('skipped: ' + bad.slice(0, 3).join(' · ') + (bad.length > 3 ? ' …' : ''), 'err');
  }
  async develop(f) {
    const orig = URL.createObjectURL(f);
    try {
      const img = await loadImg(orig);
      if (!img.naturalWidth || !img.naturalHeight) throw new Error('size');
      const work = scaleCanvas(img, 2000);
      const thumb = URL.createObjectURL(await toBlob(scaleCanvas(img, 320), 'image/jpeg', .82));
      const id = 'p' + Math.random().toString(36).slice(2, 9);
      this.imgs.set(id, work);
      return { id, name: f.name, thumb, w: img.naturalWidth, h: img.naturalHeight, date: f.lastModified || Date.now() };
    } finally { URL.revokeObjectURL(orig); }
  }
  remove(id) {
    const p = this.state.photos.find(x => x.id === id); if (!p) return;
    URL.revokeObjectURL(p.thumb); this.imgs.delete(id);
    this.setState(s => ({ photos: s.photos.filter(x => x.id !== id), sel: s.sel.filter(x => x !== id) }));
  }
  filmSel() {
    const m = new Map(this.state.photos.map(p => [p.id, p]));
    return this.state.sel.map(id => m.get(id)).filter(Boolean).slice(0, FILM[this.state.layout].max);
  }
  geom(layout, n) {

      for (let i = 0; i < n; i++) cells.push({ x: SIDE, y: TOP + i * (FH + GAP), w: FW, h: FH });
      return { W: FW + 2 * SIDE, H: TOP + n * FH + (n - 1) * GAP + BOT, SIDE, cells };
    }
    if (layout === 'booth') {
      const cols = n === 1 ? 1 : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols), CW = 900, CH = 1125, M = 90, G = 44, FOOT = 320, cells = [];
      for (let i = 0; i < cols * rows; i++) cells.push({ x: M + (i % cols) * (CW + G), y: M + Math.floor(i / cols) * (CH + G), w: CW, h: CH });
      return { W: 2 * M + cols * CW + (cols - 1) * G, H: M + rows * CH + (rows - 1) * G + FOOT, M, FOOT, cells };
    }
    const cols = Math.max(1, Math.min(n, 6, Math.ceil(Math.sqrt(n * 1.4)))), rows = Math.ceil(n / cols), CW = 720, CH = 480, FG = 28, M = 110, HEAD = 230, RG = 56, BH = CH + 140, cells = [];
    for (let i = 0; i < n; i++) cells.push({ x: M + (i % cols) * (CW + FG), y: HEAD + Math.floor(i / cols) * (BH + RG) + 70, w: CW, h: CH, contain: true });
    return { W: 2 * M + cols * CW + (cols - 1) * FG, H: HEAD + rows * BH + (rows - 1) * RG + M, M, HEAD, BH, RG, CW, FG, cols, rows, cells };
  }
  exportScale(g) { return Math.min(2, Math.sqrt(MAX_PX / (g.W * g.H))); }
  grade(c, r, o, k, i) {
    const warm = o.warmth / 100, fade = o.fade / 100, gr = o.grain / 100 * 80, mono = o.mono;
    if (!warm && !fade && !gr && !mono) return;
    const X = Math.max(0, Math.round(r.x * k)), Y = Math.max(0, Math.round(r.y * k));
    const Wd = Math.min(c.canvas.width - X, Math.round(r.w * k)), Hd = Math.min(c.canvas.height - Y, Math.round(r.h * k));

      let n = 0; if (gr) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; n = ((s >>> 0) / 4294967296 - .5) * gr; }

  leak(c, r, o, i) {
    if (!o.leak) return; const R = rng(i * 7919 + 31), a = o.leak / 100;

    g.addColorStop(0, 'rgba(255,150,60,' + (.9 * a) + ')'); g.addColorStop(.35, 'rgba(255,70,40,' + (.6 * a) + ')'); g.addColorStop(1, 'rgba(255,40,20,0)');
    c.fillStyle = g; c.fillRect(r.x, r.y, r.w, r.h);
    const bx = r.x + r.w * R(); g = c.createLinearGradient(bx - r.w * .14, 0, bx + r.w * .14, 0);

    c.shadowColor = 'rgba(255,80,20,.9)'; c.shadowBlur = fs * .35 * k; c.fillStyle = '#ff9a3c';
    c.fillText(stampText(ts), r.x + r.w - fs * .6, r.y + r.h - fs * .5); c.restore();
  }
  title(c, t, x, y, size, col, sh, align) {
    c.font = size + "px 'Rammetto One', serif"; c.textAlign = align;
    c.fillStyle = sh; c.fillText(t, x + size * .07, y + size * .07); c.fillStyle = col; c.fillText(t, x, y);
  }
  paint(cv, sel, o, k) {
    const layout = o.layout, n = sel.length, g = this.geom(layout, n);
    cv.width = Math.max(1, Math.round(g.W * k)); cv.height = Math.max(1, Math.round(g.H * k));
    const c = cv.getContext('2d'); if (!c) throw new Error('no-canvas');
    c.setTransform(k, 0, 0, k, 0, 0); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; c.textBaseline = 'alphabetic';
    const today = longDate(new Date());
    if (layout === 'strip') {
      c.fillStyle = '#17130f'; c.fillRect(0, 0, g.W, g.H); c.fillStyle = '#f1e6cf';

  }
  schedulePreview(tries = 0) { clearTimeout(this.pvT); this.pvT = setTimeout(() => { if (this.previewRef.current) this.drawPreview(); else if (tries < 25) this.schedulePreview(tries + 1); }, 40); }

  }

    } catch (e) {

  }
  renderVals() {

    const has = photos.length > 0, fsel = this.filmSel(), maxF = FILM[layout].max;
    const pvKey = [layout, st.grain, st.warmth, st.fade, st.leak, st.mono, st.date, fsel.map(p => p.id).join(',')].join('|');

      fileRef: this.fileRef, previewRef: this.previewRef, maxMB: this.props.maxUploadMB ?? 80,
      always: true,

      emptySub: has ? 'they print in the order you tap them' : 'click or drop images here · jpg png webp · up to ' + (this.props.maxUploadMB ?? 80) + ' mb each · stays in your browser',
      emptyClick: () => { if (!has && this.fileRef.current) this.fileRef.current.click(); },

      noSel: !fsel.length,
